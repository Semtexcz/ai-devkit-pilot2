# mypy: type-checking policy only.
#
# `mise run typecheck` also passes `--strict` explicitly, so the standard does not
# depend on this file being discovered. It exists so editors and a plain `mypy`
# invocation apply the same baseline.
#
# Expand `files` when application modules are added next to `main.py`.
[mypy]
strict = True
files = main.py
